[package]
name = "runsift"
version = "0.1.0"
edition = "2024"
description = "Turn failed local runs into compact, traceable evidence bundles"
license = "Apache-2.0"
homepage = "https://github.com/HHjoker/runsift"
repository = "https://github.com/HHjoker/runsift"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
