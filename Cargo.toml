[package]
name = "runsift"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Turn runtime evidence into traceable diagnostic context for developers and AI"
license = "Apache-2.0"
homepage = "https://github.com/HHjoker/runsift"
repository = "https://github.com/HHjoker/runsift"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
